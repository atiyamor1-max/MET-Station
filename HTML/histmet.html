<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />

    <title>History</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
  </head>
  <body style="font-family: Verdana, Geneva, Tahoma, sans-serif">
    <!-- Navbar -->
    <div
      class="bg-dark text-white py-3 shadow-sm fixed-top"
      style="background-color: #002b7f !important"
    >
      <div class="container d-flex justify-content-between align-items-center">
        <h4 class="m-0" style="font-weight: bold;">MET STATION</h4>
        <div class="d-flex gap-4">
          <a href="/HTML/index.html" class="text-white text-decoration-none"
            >Home</a
          >
          <a href="/HTML/about.html" class="text-white text-decoration-none"
            >About</a
          >
          <a href="/HTML/histmet.html" class="text-white text-decoration-none"
            >History</a
          >
          <a href="/HTML/current.html" class="text-white text-decoration-none"
            >Current</a
          >
          <a href="/HTML/contact.html" class="btn btn-outline-light btn-sm"
            >Contact</a
          >
        </div>
      </div>
    </div>

    <!-- HISTORY SECTION (added content) -->
    <div class="container" style="margin-top: 150px; margin-bottom: 80px">
      <h2
        class="text-center text-white mb-5"
        style="background-color: #002b7f; padding: 10px; border-radius: 10px"
      >
        Sensor History
      </h2>

      <div class="row g-4">
        <!-- Speed Card -->
        <div class="col-md-4 mb-4">
          <div
            class="card shadow-sm"
            style="
              background-color: rgba(225, 225, 225, 0.7);
              border-radius: 15px;
            "
          >
            <div class="card-body">
              <h5
                class="card-title text-center"
                style="
                  background-color: #002b7f;
                  color: white;
                  padding: 5px;
                  border-radius: 10px;
                "
              >
                Wind Speed
              </h5>
              <ul
                id="history-speed"
                class="list-group list-group-flush"
                style="border-radius: 10px; max-height: 250px; overflow-y: auto"
              ></ul>
            </div>
          </div>
        </div>

        <!-- Direction Card -->
        <div class="col-md-4 mb-4">
          <div
            class="card shadow-sm"
            style="
              background-color: rgba(225, 225, 225, 0.7);
              border-radius: 15px;
            "
          >
            <div class="card-body">
              <h5
                class="card-title text-center"
                style="
                  background-color: #002b7f;
                  color: white;
                  padding: 5px;
                  border-radius: 10px;
                "
              >
                Wind Direction
              </h5>
              <ul
                id="history-direction"
                class="list-group list-group-flush"
                style="max-height: 250px; overflow-y: auto"
              ></ul>
            </div>
          </div>
        </div>

        <!-- Humidity Card -->
        <div class="col-md-4 mb-4">
          <div
            class="card shadow-sm"
            style="
              background-color: rgba(225, 225, 225, 0.7);
              border-radius: 15px;
            "
          >
            <div class="card-body">
              <h5
                class="card-title text-center"
                style="
                  background-color: #002b7f;
                  color: white;
                  padding: 5px;
                  border-radius: 10px;
                "
              >
                Humidity
              </h5>
              <ul
                id="history-humidity"
                class="list-group list-group-flush"
                style="max-height: 250px; overflow-y: auto"
              ></ul>
            </div>
          </div>
        </div>

        <!-- Temperature Card -->
        <div class="col-md-6 mb-4">
          <div
            class="card shadow-sm"
            style="
              background-color: rgba(225, 225, 225, 0.7);
              border-radius: 15px;
            "
          >
            <div class="card-body">
              <h5
                class="card-title text-center"
                style="
                  background-color: #002b7f;
                  color: white;
                  padding: 5px;
                  border-radius: 10px;
                "
              >
                Temperature
              </h5>
              <ul
                id="history-temperature"
                class="list-group list-group-flush"
                style="max-height: 250px; overflow-y: auto"
              ></ul>
            </div>
          </div>
        </div>

        <!-- Light Level Card -->
        <div class="col-md-6 mb-4">
          <div
            class="card shadow-sm"
            style="
              background-color: rgba(225, 225, 225, 0.7);
              border-radius: 15px;
            "
          >
            <div class="card-body">
              <h5
                class="card-title text-center"
                style="
                  background-color: #002b7f;
                  color: white;
                  padding: 5px;
                  border-radius: 10px;
                "
              >
                Light Level
              </h5>
              <ul
                id="history-light"
                class="list-group list-group-flush"
                style="max-height: 250px; overflow-y: auto"
              ></ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- cloud background -->
    <div id="background-wrap">
      <div class="x1">
        <div class="cloud"></div>
      </div>

      <div class="x2">
        <div class="cloud"></div>
      </div>

      <div class="x3">
        <div class="cloud"></div>
      </div>

      <div class="x4">
        <div class="cloud"></div>
      </div>

      <div class="x5">
        <div class="cloud"></div>
      </div>
    </div>

    <!-- link to css -->
    <link rel="stylesheet" href="/CSS/mainmet.css" />

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script
      src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
      integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
      integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
      crossorigin="anonymous"
    ></script>

    <!--firebase library -->

    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>

    <!--firebase realtime library -->
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-database-compat.js"></script>

    <!--js page link -->
    <script src="/JS/his.js"></script>
  </body>
</html>
