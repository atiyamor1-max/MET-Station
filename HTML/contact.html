<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />

    <title>Contact</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
  </head>
  <body style="font-family: Verdana, Geneva, Tahoma, sans-serif">
    <!-- Navbar -->
    <div
      class="bg-dark text-white py-3 shadow-sm fixed-top"
      style="background-color: #002b7f !important"
    >
      <div class="container d-flex justify-content-between align-items-center">
        <h4 class="m-0" style="font-weight: bold">MET STATION</h4>
        <div class="d-flex gap-4">
          <a href="/HTML/index.html" class="text-white text-decoration-none"
            >Home</a
          >
          <a href="/HTML/about.html" class="text-white text-decoration-none"
            >About</a
          >
          <a href="/HTML/histmet.html" class="text-white text-decoration-none"
            >History</a
          >
          <a href="/HTML/current.html" class="text-white text-decoration-none"
            >Current</a
          >
          <a href="/HTML/contact.html" class="btn btn-outline-light btn-sm"
            >Contact</a
          >
        </div>
      </div>
    </div>

    <div
      class="d-flex justify-content-center align-items-center"
      style="min-height: 100vh; margin-top: 80px"
    >
      <div class="col-md-6" style="text-align: center">
        <div
          class="card h-100 shadow-sm"
          style="
            min-height: 350px;
            width: 80%;
            margin: auto;
            background-color: rgba(255, 255, 255, 0.45);
          "
        >
          <form style="padding: 20px">
            <h4>Contact Us</h4>
            <br />

            <!-- Email -->
            <div class="form-group text-left">
              <label for="email">Email:</label>
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="Enter Your Email"
                required
              />
            </div>

            <!-- Message -->
            <div class="form-group text-left mt-3">
              <label for="message">Message:</label>
              <textarea
                class="form-control"
                id="message"
                rows="4"
                placeholder="Enter Your Message"
                required
              ></textarea>
            </div>

            <!-- Submit button -->
            <button
              type="button"
              class="btn btn-primary mt-3"
              style="
                background-color: #002b7f;
                font-family: Verdana, Geneva, Tahoma, sans-serif;
              "
              onclick="sendMessage()"
            >
              Send Message
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- cloud background -->
    <div id="background-wrap">
      <div class="x1">
        <div class="cloud"></div>
      </div>

      <div class="x2">
        <div class="cloud"></div>
      </div>

      <div class="x3">
        <div class="cloud"></div>
      </div>

      <div class="x4">
        <div class="cloud"></div>
      </div>

      <div class="x5">
        <div class="cloud"></div>
      </div>
    </div>

    <!-- link to css -->
    <link rel="stylesheet" href="/CSS/mainmet.css" />

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script
      src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
      integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
      integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
      crossorigin="anonymous"
    ></script>

    <!--firebase library -->

    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>

    <!--firebase realtime library -->
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-database-compat.js"></script>

    <!--js page link -->
    <script src="/JS/contact.js"></script>
  </body>
</html>
