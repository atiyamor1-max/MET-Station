<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <a href="current.html" class="text-white text-decoration-none">Current</a>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />

    <title>Current</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
  </head>
  <body style="font-family: Verdana, Geneva, Tahoma, sans-serif">
    <!-- Navbar -->
    <div
      class="bg-dark text-white py-3 shadow-sm fixed-top"
      style="background-color: #002b7f !important"
    >
      <div class="container d-flex justify-content-between align-items-center">
        <h4 class="m-0" style="font-weight: bold">MET STATION</h4>
        <div class="d-flex gap-4">
          <a href="index.html" class="text-white text-decoration-none">Home</a>
          <a href="about.html" class="text-white text-decoration-none">About</a>
          <a href="histmet.html" class="text-white text-decoration-none"
            >History</a
          >
          <a href="current.html" class="text-white text-decoration-none"
            >Current</a
          >
          <a href="contact.html" class="btn btn-outline-light btn-sm"
            >Contact</a
          >
        </div>
      </div>
    </div>

    <!-- SENSOR DISPLAY CARDS -->
    <div class="container mt-5 pt-5">
      <div class="row" style="padding-bottom: 60px">
            <!-- compass -->
    <div class="widget-card">
      <h3>Wind Direction</h3>

      <div class="compass">
        <div class="compass-ring"></div>
        <div class="compass-arrow" id="compassArrow"></div>
        <div class="compass-center"></div>
      </div>

      <p id="directionLabel">0° (N)</p>
    </div>

    <!-- anemometer -->

    <div class="widget-card">
      <h3>Wind Speed</h3>

      <div class="anemometer">
        <div class="rotor" id="rotor">
          <div class="blade blade1"></div>
          <div class="blade blade2"></div>
          <div class="blade blade3"></div>
        </div>
      </div>

      <p id="speedLabel">0 km/h</p>
    </div>

    <!-- thermometer -->

    <div class="widget-card">
      <h3>Temperature</h3>

      <div class="thermometer">
        <div class="thermo-fill" id="thermoFill"></div>
        <div class="thermo-bulb"></div>
      </div>

      <p id="tempLabel">0°C</p>
    </div>

    <!--waterdrop' -->

    <div class="widget-card">
      <h3>Humidity</h3>

      <div class="drop">
        <div class="drop-fill" id="dropFill"></div>
      </div>

      <p id="humLabel">0%</p>
    </div>
    
    <!--sun' -->

    <div class="widget-card">
      <h3>Light Level</h3>

      <div class="sun" id="sun"></div>

      <p id="luxLabel">0 Lux</p>
    </div>
        <!--  temp input  -->
        <div class="col-md-6">
          <div
            class="card p-3 mb-3"
            style="background-color: rgba(225, 225, 225, 0.45); height: 85.5%"
          >
            <label
              for="REFTEMP"
              class="form-label"
              style="
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                color: #002b7f;
                font-weight: bold;
                font-size: larger;
                padding-top: 20px;
              "
            >
              Set Reference Temperature:
            </label>
            <div class="d-flex" style="padding-left: 290px; padding-top: 2%">
              <input
                id="tempinput"
                type="text"
                class="form-control mr-2"
                style="max-width: 120px; box-shadow: inset"
              />
              <button
                class="btn"
                style="
                  background-color: #002b7f;
                  color: #e1d9d9;
                  font-family: Verdana, Geneva, Tahoma, sans-serif;
                "
                onclick="setTempRef()"
              >
                Set Ref
              </button>
            </div>
          </div>
        </div>
        <!--  buzzer buttons   -->
        <div class="col-md-6">
          <div
            class="card p-3 mb-3"
            style="background-color: rgba(225, 225, 225, 0.45); height: 85.5%"
          >
            <label
              class="form-label"
              style="
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                color: #002b7f;
                font-weight: bold;
                font-size: larger;
                padding-top: 20px;
              "
            >
              Buzzer Control
            </label>

            <div
              class="d-flex justify-content-center gap-2"
              style="padding-top: 2%"
            >
              <!-- Each button keeps the same press/hold handlers used before -->
              <button
                id="ENABLEBTN"
                type="button"
                class="btn"
                style="
                  background-color: #0c141e;
                  color: #e1d9d9;
                  font-family: Verdana, Geneva, Tahoma, sans-serif;
                "
                onmousedown="buzzerOn()"
                onmouseup="buzzerOff()"
                onmouseleave="buzzerOff()"
                ontouchstart="event.preventDefault(); buzzerOn()"
                ontouchend="buzzerOff()"
              >
                Enable
              </button>
              <button
                id="buzzerBtn1"
                type="button"
                class="btn"
                style="
                  background-color: #003f8a;
                  color: #e1d9d9;
                  font-family: Verdana, Geneva, Tahoma, sans-serif;
                "
                onmousedown="buzzerOn()"
                onmouseup="buzzerOff()"
                onmouseleave="buzzerOff()"
                ontouchstart="event.preventDefault(); buzzerOn()"
                ontouchend="buzzerOff()"
              >
                Sound 1
              </button>

              <button
                id="buzzerBtn2"
                type="button"
                class="btn"
                style="
                  background-color: #0057b8;
                  color: #e1f0ff;
                  font-family: Verdana, Geneva, Tahoma, sans-serif;
                "
                onmousedown="buzzerOn()"
                onmouseup="buzzerOff()"
                onmouseleave="buzzerOff()"
                ontouchstart="event.preventDefault(); buzzerOn()"
                ontouchend="buzzerOff()"
              >
                Sound 2
              </button>

              <button
                id="buzzerBtn3"
                type="button"
                class="btn"
                style="
                  background-color: #2b82e6;
                  color: #04233a;
                  font-family: Verdana, Geneva, Tahoma, sans-serif;
                "
                onmousedown="buzzerOn()"
                onmouseup="buzzerOff()"
                onmouseleave="buzzerOff()"
                ontouchstart="event.preventDefault(); buzzerOn()"
                ontouchend="buzzerOff()"
              >
                Sound 3
              </button>

              <button
                id="buzzerBtn4"
                type="button"
                class="btn"
                style="
                  background-color: #66a9ff;
                  color: #04233a;
                  font-family: Verdana, Geneva, Tahoma, sans-serif;
                "
                onmousedown="buzzerOn()"
                onmouseup="buzzerOff()"
                onmouseleave="buzzerOff()"
                ontouchstart="event.preventDefault(); buzzerOn()"
                ontouchend="buzzerOff()"
              >
                Sound 4
              </button>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div
            class="card p-3 mb-3"
            style="background-color: rgba(225, 225, 225, 0.45); height: 85.5%"
          >
            <h5
              class="sensor-title"
              style="
                color: #002b7f;
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                font-weight: bold;
              "
            >
              ESP32-CAM Live Stream
            </h5>
            <div class="card-body">
              <h5 class="card-title">Camera</h5>
              <img
                id="camPreview"
                alt="Camera preview"
                style="width: 100%; max-width: 640px"
              />
            </div>
          </div>
        </div>
      </div>
    </div>


    <!-- cloud background -->
    <div id="background-wrap">
      <div class="x1">
        <div class="cloud"></div>
      </div>

      <div class="x2">
        <div class="cloud"></div>
      </div>

      <div class="x3">
        <div class="cloud"></div>
      </div>

      <div class="x4">
        <div class="cloud"></div>
      </div>

      <div class="x5">
        <div class="cloud"></div>
      </div>
    </div>

    <!-- link to css -->

    <!-- link to main -->
    <link rel="stylesheet" href="CSS/mainmet.css" />

    <!-- link to current -->
    <link rel="stylesheet" href="CSS/current.css" />

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script
      src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
      integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
      integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
      crossorigin="anonymous"
    ></script>

    <!--firebase library -->

    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>

    <!--firebase realtime library -->
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-database-compat.js"></script>

    <!--js page link -->
    <script src="JS/current.js"></script>
  </body>
</html>
